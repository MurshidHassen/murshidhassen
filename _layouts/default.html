<!doctype html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <meta name="description" content="{{ page.description | default: site.description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
    {% seo %}
  </head>
  <body>
    <div class="page-bg" aria-hidden="true">
      <canvas id="bg-canvas"></canvas>
      <div class="page-bg-overlay"></div>
    </div>

    <header class="site-header">
      <nav class="nav container" aria-label="Main navigation">
        <a class="nav-brand" href="{{ '/' | relative_url }}">
          <span class="nav-brand-mark">MH</span>
          <span class="nav-brand-text">{{ site.title }}</span>
        </a>

        <button class="nav-toggle" type="button" aria-label="Toggle menu" aria-expanded="false">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <div class="nav-links">
          <a href="{{ '/' | relative_url }}#about">About</a>
          <a href="{{ '/' | relative_url }}#experience">Experience</a>
          <a href="{{ '/' | relative_url }}#projects">Projects</a>
          <a href="{{ '/' | relative_url }}#skills">Skills</a>
          <a href="{{ '/resume/' | relative_url }}">Resume</a>
          <a class="nav-cta" href="https://github.com/{{ site.github_username }}" target="_blank" rel="noopener noreferrer">GitHub</a>
        </div>
      </nav>
    </header>

    <main class="site-main">
      {{ content }}
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <div class="footer-brand">
          <strong>{{ site.title }}</strong>
          <p>{{ site.description }}</p>
        </div>
        <div class="footer-links">
          {% for link in site.social %}
            <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.name }}</a>
          {% endfor %}
          <a href="{{ '/license/' | relative_url }}">License</a>
        </div>
        <p class="footer-note">
          Built with Jekyll · Hosted on GitHub Pages
        </p>
      </div>
    </footer>

    <script src="{{ site.baseurl }}/assets/js/background.js"></script>
    <script src="{{ site.baseurl }}/assets/js/main.js"></script>
  </body>
</html>
